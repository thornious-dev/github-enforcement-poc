name: acceptance
on:
  pull_request:
    paths:
      - "**"
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:task-contract
      - run: npm run accept
