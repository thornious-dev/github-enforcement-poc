name: risk
on:
  pull_request:
    paths:
      - "**"
jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: classify
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-files.txt"
          node scripts/classify-risk.js --file "$RUNNER_TEMP/changed-files.txt"
      - run: echo "Risk level is ${{ steps.classify.outputs.level }}"
