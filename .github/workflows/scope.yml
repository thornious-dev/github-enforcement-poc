name: scope
on:
  pull_request:
    paths:
      - "**"
jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-scope.js $(git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }})
